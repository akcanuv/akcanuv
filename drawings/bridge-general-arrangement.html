<style>
  :root{
    --ink:#111c27; --accent:#1962b4;
    --g300:#d1d7db; --g400:#9ca6af; --g500:#6b7580; --g200:#dce0e4; --g100:#f3f4f6; --g50:#f9fafb;
    --paper:#ffffff; --hatch:#1962b4;
    --mono:"JetBrains Mono",ui-monospace,monospace;
    --disp:"Inter Tight",system-ui,sans-serif;
    --dur:7200ms;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--g50); color:var(--ink); font-family:var(--disp);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:32px;
    -webkit-font-smoothing:antialiased;}
  .frame{width:min(1180px,100%); background:var(--paper); border:1px solid var(--ink);
    display:flex; flex-direction:column;}

  .bar{display:none; align-items:center; gap:16px; padding:14px 20px;}
  .bar.top{border-bottom:1px solid var(--ink);}
  .mark{font-weight:700; letter-spacing:.14em; font-size:15px;}
  .mark .dot{color:var(--accent); margin:0 .28em;}
  .tag{font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; color:var(--g500); text-transform:uppercase;}
  .spacer{flex:1; height:1px; background:var(--g200);}
  .meta{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--g500); white-space:nowrap;}
  .meta .code{color:var(--accent);}

  .canvas{position:relative;
    background:
      linear-gradient(90deg,transparent 0,transparent calc(100% - 1px),var(--g100) 100%),
      linear-gradient(0deg,transparent 0,transparent calc(100% - 1px),var(--g100) 100%);
    background-size:28px 28px; border-bottom:0;}
  .canvas::after{content:""; position:absolute; inset:0; pointer-events:none;
    background:radial-gradient(120% 90% at 50% 46%,transparent 60%,rgba(17,28,39,.035));}
  svg#dwg{display:block; width:100%; height:auto;}

  .ln{fill:none; stroke:var(--ink); vector-effect:non-scaling-stroke;
      stroke-linecap:round; stroke-linejoin:round; stroke-width:1.35px;}
  .ln.s-dims{stroke-width:.8px; stroke:var(--g400);}
  .ln.s-labels{stroke-width:1px; stroke:var(--accent);}
  .ln.drawing{stroke:var(--accent)!important;}
  .cl{fill:none; stroke:var(--g400); vector-effect:non-scaling-stroke;
      stroke-width:1px; stroke-dasharray:14 5 3 5; opacity:0;}
  .fill{fill:var(--hatch); stroke:none; opacity:0;}

  text{font-family:var(--mono); fill:var(--ink); opacity:0;}
  text.k-dim{fill:var(--g500);}
  text.k-level{fill:var(--accent); font-weight:500;}
  text.k-cl{fill:var(--g500); letter-spacing:.04em;}
  text.k-note{fill:var(--g500);}
  text.k-title{fill:var(--ink); font-weight:500; letter-spacing:.06em;}

  .bar.bot{gap:14px;}
  .sq{width:9px; height:9px; background:var(--g300); flex:none; transition:background .3s;}
  .sq.live{background:var(--accent);}
  .cap{font-family:var(--mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink);}
  .cap .n{color:var(--g400); margin-right:.5em;}
  .ticks{display:flex; gap:5px; margin-left:6px;}
  .tick{width:16px; height:2px; background:var(--g200); transition:background .35s;}
  .tick.on{background:var(--ink);}
  .btn{font-family:var(--mono); font-size:10.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink); background:var(--paper); border:1px solid var(--ink); padding:7px 14px;
    cursor:pointer; border-radius:0; display:inline-flex; align-items:center; gap:8px;
    transition:background .15s,color .15s;}
  .btn:hover{background:var(--ink); color:var(--paper);}
  .btn svg{width:11px; height:11px; stroke:currentColor; fill:none; stroke-width:1.5;}
  .progress{display:none; height:2px; background:var(--g100);}
  .progress > i{display:block; height:100%; width:0; background:var(--accent);}
  @media (max-width:680px){
    body{padding:0} .frame{border-left:none;border-right:none;min-height:100vh}
    .meta .d{display:none} .ticks{display:none}
  }

  /* ---- embed mode: render directly on host background, no box/title ---- */
  html,body{ background:transparent !important; }
  .frame{ background:transparent !important; border:0 !important; box-shadow:none !important; }
  .canvas{ background:none !important; }
  .canvas::after{ display:none !important; }
  text.k-title{ display:none !important; }
</style>

kind":"note","anchor":"start"},{"text":"500x500 RCC","raw":"500x500 RCC","x":18715.46,"y":6782.16,"size":150.0,"rot":-0.0,"stage":"labels","kind":"note","anchor":"start"},{"text":"BLOCK (TYP)","raw":"BLOCK (TYP)","x":18715.46,"y":7063.41,"size":150.0,"rot":-0.0,"stage":"labels","kind":"note","anchor":"start"},{"text":"65 THK. WEARING COAT","raw":"65 THK. WEARING COAT","x":6305.29,"y":3849.03,"size":150.0,"rot":-0.0,"stage":"labels","kind":"note","anchor":"start"},{"text":"500","raw":"500","x":4452.96,"y":3832.78,"size":150.0,"rot":-0.0,"stage":"dims","kind":"dim","anchor":"middle"},{"text":"7000","raw":"7000","x":10702.96,"y":9429.03,"size":150.0,"rot":-0.0,"stage":"dims","kind":"dim","anchor":"middle"},{"text":"2125","raw":"2125","x":17140.46,"y":7632.53,"size":150.0,"rot":-0.0,"stage":"dims","kind":"dim","anchor":"middle"},{"text":"1275","raw":"1275","x":5340.46,"y":7632.53,"size":150.0,"rot":-0.0,"stage":"dims","kind":"dim","anchor":"middle"},{"text":"DHARI JHORA BRIDGE","raw":"DHARI JHORA BRIDGE","x":10842.87,"y":447.64,"size":477.5,"rot":0.0,"stage":"title","kind":"title","anchor":"middle"}]};
const SVGNS = "http://www.w3.org/2000/svg";
const STAGES = DATA.stages;
const ORDER  = DATA.stageOrder;
const easeInOut = t => t<.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2;
const easeOut   = t => 1-Math.pow(1-t,3);
const riseU = DATA.viewBox[3]*0.006;
function labelTransform(f, p){
  let tf=""; const dy=(1-p)*riseU;
  if(f.rise && dy>0.5) tf += `translate(0 ${dy.toFixed(1)}) `;
  if(f.rot) tf += `rotate(${f.rot} ${f.x} ${f.y})`;
  return tf.trim();
}

/* chrome from data */
if(DATA.chrome){
  if(DATA.chrome.tag) document.getElementById("tag").innerHTML = DATA.chrome.tag.replace(/ /g,"&nbsp;");
  document.getElementById("meta").innerHTML =
    (DATA.chrome.code?`<span class="code">${DATA.chrome.code}</span> · `:"") + (DATA.chrome.meta||"");
  if(DATA.chrome.title) document.title = "AKC ANUV · " + DATA.chrome.title;
}

/* build the SVG */
const svg = document.getElementById("dwg");
svg.setAttribute("viewBox", DATA.viewBox.join(" "));
svg.style.aspectRatio = DATA.viewBox[2] + " / " + DATA.viewBox[3];
const gFill = mk("g"), gLine = mk("g"), gText = mk("g");
svg.append(gFill, gLine, gText);
function mk(t){return document.createElementNS(SVGNS,t);}
function ptsToD(pts){ let d="M"+pts[0][0]+" "+pts[0][1];
  for(let i=1;i<pts.length;i++) d+="L"+pts[i][0]+" "+pts[i][1]; return d; }

const drawables=[], fades=[];
DATA.fills.forEach(f=>{
  const el=mk("polygon");
  el.setAttribute("points", f.pts.map(p=>p.join(",")).join(" "));
  el.setAttribute("class","fill"); gFill.append(el);
  fades.push({el, stage:f.stage, max:0.13});
});
DATA.polylines.forEach(o=>{
  const el=mk("path"); el.setAttribute("d", ptsToD(o.pts));
  if(o.kind==="centerline"){
    el.setAttribute("class","cl"); gLine.append(el);
    fades.push({el, stage:o.stage, max:0.9}); return;
  }
  el.setAttribute("class","ln s-"+o.stage); gLine.append(el);
  const len=el.getTotalLength()||o.len||1;
  el.style.strokeDasharray=len; el.style.strokeDashoffset=len;
  drawables.push({el,len,stage:o.stage,state:0});
});
DATA.labels.forEach(l=>{
  const el=mk("text");
  el.setAttribute("x",l.x); el.setAttribute("y",l.y);
  el.setAttribute("font-size", l.kind==="title" ? l.size*1.5 : l.size);
  el.setAttribute("text-anchor", l.anchor||"start");
  el.setAttribute("class","k-"+l.kind);
  if(l.rot) el.setAttribute("transform",`rotate(${l.rot} ${l.x} ${l.y})`);
  String(l.text).split("\n").forEach((s,i)=>{
    const ts=mk("tspan"); ts.textContent=s;
    if(i>0){ts.setAttribute("x",l.x); ts.setAttribute("dy",l.size*1.1);}
    el.append(ts);
  });
  gText.append(el);
  fades.push({el, stage:l.stage, label:true, rise:l.kind!=="title", rot:l.rot||0, x:l.x, y:l.y, max:1});
});

/* which stages actually have content */
const present = new Set([...drawables.map(d=>d.stage), ...fades.map(f=>f.stage)]);
const SEQ = ORDER.filter(s=>present.has(s));   // populated stages in order

/* timeline windows */
function windows(items){
  const byStage={};
  items.forEach(it=>{(byStage[it.stage]=byStage[it.stage]||[]).push(it);});
  for(const st in byStage){
    const S=STAGES[st]||{a:0,b:1}, span=S.b-S.a, draw=span*0.5, N=byStage[st].length;
    byStage[st].forEach((it,i)=>{ const f=N>1?i/(N-1):0; it.t0=S.a+(span-draw)*f; it.t1=it.t0+draw; });
  }
}
drawables.sort((p,q)=> p.stage===q.stage ? q.len-p.len : ORDER.indexOf(p.stage)-ORDER.indexOf(q.stage));
windows(drawables); windows(fades);

/* chrome state */
const capEl=document.getElementById("cap"), sqEl=document.getElementById("sq");
const progEl=document.getElementById("prog"), ticksEl=document.getElementById("ticks");
const _seen=new Set();
const tickEls=SEQ.filter(s=>s!=="title")
  .filter(s=>{ const n=STAGES[s].n; if(_seen.has(n)) return false; _seen.add(n); return true; })
  .map(s=>{ const t=document.createElement("span"); t.className="tick"; ticksEl.append(t); return {s,el:t}; });
let curStage=null;
function setCaption(clock){
  let st=SEQ[0];
  for(const s of SEQ){ if(clock>=STAGES[s].a) st=s; }
  if(st!==curStage){
    curStage=st; const S=STAGES[st];
    capEl.innerHTML=`<span class="n">${S.n}</span>${S.label}`;
    sqEl.classList.add("live");
    tickEls.forEach(t=>{ if(SEQ.indexOf(t.s)<=SEQ.indexOf(st)) t.el.classList.add("on"); });
  }
}

/* animation loop */
let startT=null, raf=null, finished=false;
const DUR = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dur'))||7200;
function apply(clock){
  for(const d of drawables){
    if(clock<=d.t0){ if(d.state!==0){d.el.style.strokeDashoffset=d.len; d.el.classList.remove("drawing"); d.state=0;} continue; }
    if(clock>=d.t1){ if(d.state!==2){d.el.style.strokeDashoffset=0; d.el.classList.remove("drawing"); d.state=2;} continue; }
    const p=easeInOut((clock-d.t0)/(d.t1-d.t0));
    d.el.style.strokeDashoffset=d.len*(1-p);
    if(d.state!==1){d.el.classList.add("drawing"); d.state=1;}
  }
  for(const f of fades){
    let p = clock<=f.t0 ? 0 : clock>=f.t1 ? 1 : easeOut((clock-f.t0)/(f.t1-f.t0));
    f.el.style.opacity = p*f.max;
    if(f.label) f.el.setAttribute("transform", labelTransform(f, p));
  }
  setCaption(clock);
  progEl.style.width=(clock*100).toFixed(2)+"%";
}
function frame(ts){ if(startT===null) startT=ts; let clock=(ts-startT)/DUR;
  if(clock>=1){clock=1; finished=true;} apply(clock); if(!finished) raf=requestAnimationFrame(frame); }
function play(){ cancelAnimationFrame(raf); startT=null; finished=false;
  drawables.forEach(d=>d.state=-1); raf=requestAnimationFrame(frame); }
function showFinal(){
  drawables.forEach(d=>{d.el.style.strokeDashoffset=0; d.el.classList.remove("drawing");});
  fades.forEach(f=>{ f.el.style.opacity=f.max; if(f.label) f.el.setAttribute("transform", labelTransform(f,1)); });
  progEl.style.width="100%"; tickEls.forEach(t=>t.el.classList.add("on")); sqEl.classList.add("live");
  const last=SEQ[SEQ.length-1], S=STAGES[last]; curStage=last;
  capEl.innerHTML=`<span class="n">${S.n}</span>${S.label}`;
}
document.getElementById("replay").addEventListener("click",play);

const fontsReady = Promise.race([
  document.fonts ? document.fonts.ready : Promise.resolve(),
  new Promise(r=>setTimeout(r,900)),
]);
const params=new URLSearchParams(location.search);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if(params.has("t")){ apply(parseFloat(params.get("t"))); }
else if(params.has("final")||reduce){ showFinal(); }
else{ fontsReady.then(()=>{ setTimeout(play,300); }); }
</script>
