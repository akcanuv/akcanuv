// FlowOctave: lazy noise field. Holds two tiny (freq+1)² control grids and
// samples them on demand via smooth-bilinear interp — no W*H upscale buffer.
// This collapses the per-frame cost from O(W*H) to O(dotCount) per octave.
const SRC_X_INV = 1 / (W - 1), SRC_Y_INV = 1 / (H - 1);
class FlowOctave {
  constructor(freq) {
    this.freq = freq; this.n = freq + 1;
    this.cur = this._grid(); this.nxt = this._grid();
    this.phase = 0;
  }
  _grid() { const n = this.n; const g = new Float32Array(n * n); for (let i = 0; i < n*n; i++) g[i] = Math.random()*2 - 1; return g; }
  step(dphase) { this.phase += dphase; while (this.phase >= 1) { this.phase -= 1; this.cur = this.nxt; this.nxt = this._grid(); } }
  // Sample at source coords (sx in [0..W-1], sy in [0..H-1]). Inlines phase blend.
  sample(sx, sy) {
    const f = this.freq, n = this.n;
    const xi = sx * SRC_X_INV * f, yi = sy * SRC_Y_INV * f;
    const x0 = xi | 0, x1 = x0 < f ? x0 + 1 : x0;
    const y0 = yi | 0, y1 = y0 < f ? y0 + 1 : y0;
    let fx = xi - x0; fx = fx*fx*(3 - 2*fx);
    let fy = yi - y0; fy = fy*fy*(3 - 2*fy);
    let p = this.phase; p = p*p*(3 - 2*p);
    const inv = 1 - p, c = this.cur, nx = this.nxt;
    const i00 = y0*n + x0, i01 = y0*n + x1, i10 = y1*n + x0, i11 = y1*n + x1;
    const v00 = c[i00]*inv + nx[i00]*p, v01 = c[i01]*inv + nx[i01]*p;
    const v10 = c[i10]*inv + nx[i10]*p, v11 = c[i11]*inv + nx[i11]*p;
    return (v00*(1-fx) + v01*fx)*(1-fy) + (v10*(1-fx) + v11*fx)*fy;
  }
}

      let f = p - idx; f = f*f*f*(f*(f*6 - 15) + 10);
      const a = hash11(this.seed * 1000003 + o * 7919 + idx);
      const b = hash11(this.seed * 1000003 + o * 7919 + idx + 1);
      total += (a*(1-f) + b*f) * this.W[o];
    }
    return total;
  }
}
const msFBM = new ScalarFBM(101), tbFBM = new ScalarFBM(283);
let lastFrameMs = performance.now();

let mouseNX = 0.5, mouseNY = 0.5, mouseSmNX = 0.5, mouseSmNY = 0.5;
let mouseInside = false, infActive = 0;
function updateMouseFromEvent(e) { const rect = cv.getBoundingClientRect();
  mouseNX = (e.clientX - rect.left) / rect.width; mouseNY = (e.clientY - rect.top) / rect.height; }
cv.addEventListener('mousemove', e => { updateMouseFromEvent(e); if (!mouseInside) { mouseSmNX = mouseNX; mouseSmNY = mouseNY; } mouseInside = true; });
cv.addEventListener('mouseleave', () => { mouseInside = false; });
cv.addEventListener('mouseenter', e => { updateMouseFromEvent(e); mouseSmNX = mouseNX; mouseSmNY = mouseNY; mouseInside = true; });
cv.addEventListener('touchstart', e => { if (e.touches.length) { updateMouseFromEvent(e.touches[0]); mouseSmNX = mouseNX; mouseSmNY = mouseNY; mouseInside = true; } }, {passive: true});
cv.addEventListener('touchmove', e => { if (e.touches.length) updateMouseFromEvent(e.touches[0]); }, {passive: true});
cv.addEventListener('touchend', () => { mouseInside = false; });
cv.style.cursor = 'pointer';
cv.addEventListener('click', () => { window.open('https://gaudi.engineer', '_blank'); });

// Pre-compute dot positions and per-dot constants (independent of time) so the
// hot loop just reads from typed arrays. Layout: NX*NY dots on a regular grid.
const TWO_PI = Math.PI * 2;
const MAX_R = DOT_SPACING * DOT_FILL;
const SX_SCALE = (W - 1) / DISPLAY_PX;
const SY_SCALE = (H - 1) / DISPLAY_PX;
const INV_CT = 1.0 / CT;
const SIGMA2 = (M_R * M_R) * 0.5;
const CUTOFF2 = (M_R * M_R) * 6.0;
const MR_SRC = M_R * (W / DISPLAY_PX);
const SIGMA2_SRC = (MR_SRC * MR_SRC) * 0.5;
const CUTOFF2_SRC = (MR_SRC * MR_SRC) * 6.0;

const NX = Math.floor((DISPLAY_PX - DOT_SPACING/2) / DOT_SPACING) + 1;
const NY = NX;
const NDOTS = NX * NY;
const DOT_DX = new Float32Array(NDOTS);   // canvas-space center x
const DOT_DY = new Float32Array(NDOTS);   // canvas-space center y
const DOT_SX = new Float32Array(NDOTS);   // source-grid x (float)
const DOT_SY = new Float32Array(NDOTS);   // source-grid y (float)
const DOT_ENV = new Float32Array(NDOTS);  // bilinear env at (sx,sy), constant
const DOT_V = new Float32Array(NDOTS);    // per-frame working brightness
let dotInkTotal = 0;                       // baseline ink sum at dot positions (normalization target)
{
  let k = 0;
  for (let iy = 0; iy < NY; iy++) {
    const dy = DOT_SPACING/2 + iy * DOT_SPACING;
    if (dy >= DISPLAY_PX) break;
    const sy = dy * SY_SCALE;
    const y0 = sy | 0, y1 = y0 + 1 < H ? y0 + 1 : y0;
    const fy = sy - y0;
    for (let ix = 0; ix < NX; ix++) {
      const dx = DOT_SPACING/2 + ix * DOT_SPACING;
      if (dx >= DISPLAY_PX) break;
      const sx = dx * SX_SCALE;
      const x0 = sx | 0, x1 = x0 + 1 < W ? x0 + 1 : x0;
      const fx = sx - x0;
      const e00 = env[y0*W + x0], e01 = env[y0*W + x1];
      const e10 = env[y1*W + x0], e11 = env[y1*W + x1];
      const ev = (e00*(1-fx) + e01*fx)*(1-fy) + (e10*(1-fx) + e11*fx)*fy;
      const i00 = INK[y0*W + x0], i01 = INK[y0*W + x1];
      const i10 = INK[y1*W + x0], i11 = INK[y1*W + x1];
      const ink = (i00*(1-fx) + i01*fx)*(1-fy) + (i10*(1-fx) + i11*fx)*fy;
      DOT_DX[k] = dx; DOT_DY[k] = dy;
      DOT_SX[k] = sx; DOT_SY[k] = sy;
      DOT_ENV[k] = ev;
      dotInkTotal += ink * ev;
      k++;
    }
  }
  // truncate to actual count (in case display isn't a clean multiple)
  // (k == NDOTS for typical defaults; if not, indices past k aren't visited)
}

if (cv.width !== DISPLAY_PX) { cv.width = cv.height = DISPLAY_PX; }
const BASE_RATES = [0.010, 0.010, 0.022, 0.022, 0.040, 0.040, 0.025];
const oct0 = octaves[0], oct1 = octaves[1], oct2 = octaves[2], oct3 = octaves[3];
const oct4 = octaves[4], oct5 = octaves[5], oct6 = octaves[6];

function frame() {
  const nowMs = performance.now();
  const dt = Math.min(0.1, Math.max(0, (nowMs - lastFrameMs) / 1000));
  lastFrameMs = nowMs;

  let MS = MS0, TB = TB0;
  if (CYCLE_ON) {
    msFBM.advance(dt / Math.max(1e-3, PMS));
    tbFBM.advance(dt / Math.max(1e-3, PTB));
    MS = Math.max(0, MS0 + CMS * msFBM.sample());
    TB = Math.max(0, TB0 + CTB * tbFBM.sample());
  }

  if (mouseInside) { mouseSmNX += (mouseNX - mouseSmNX) * 0.22; mouseSmNY += (mouseNY - mouseSmNY) * 0.22; }
  const infTarget = (M_INTER && mouseInside) ? 1 : 0;
  infActive += (infTarget - infActive) * 0.12;
  const useCursor = infActive > 0.005;

  oct0.step(BASE_RATES[0] * TS_VAL); oct1.step(BASE_RATES[1] * TS_VAL);
  oct2.step(BASE_RATES[2] * TS_VAL); oct3.step(BASE_RATES[3] * TS_VAL);
  oct4.step(BASE_RATES[4] * TS_VAL); oct5.step(BASE_RATES[5] * TS_VAL);
  oct6.step(BASE_RATES[6] * TS_VAL);

  const cmxSrc = mouseSmNX * W, cmySrc = mouseSmNY * H;
  const cmx = mouseSmNX * DISPLAY_PX, cmy = mouseSmNY * DISPLAY_PX;
  const turbBoost = useCursor ? M_TURB * infActive : 0;
  const AMP_GW = AMP * GW, AMP_MS = AMP * MS;

  // Pass 1: sample noise + warp + env, compute raw brightness per dot.
  let sumV = 0;
  for (let k = 0; k < NDOTS; k++) {
    const sx = DOT_SX[k], sy = DOT_SY[k];
    let tbLocal = TB;
    if (turbBoost > 0) {
      const ddx = sx - cmxSrc, ddy = sy - cmySrc;
      const d2 = ddx*ddx + ddy*ddy;
      if (d2 < CUTOFF2_SRC) tbLocal = TB + turbBoost * Math.exp(-d2 / SIGMA2_SRC);
    }
    const dxC = oct0.sample(sx, sy), dyC = oct1.sample(sx, sy);
    const dxA = oct2.sample(sx, sy), dyA = oct3.sample(sx, sy);
    const dxB = oct4.sample(sx, sy), dyB = oct5.sample(sx, sy);
    const bri = oct6.sample(sx, sy);
    const nx = dxC*AMP_GW + dxA*AMP_MS + dxB*AMP*tbLocal;
    const ny = dyC*AMP_GW + dyA*AMP_MS + dyB*AMP*tbLocal;
    let sxx = (sx + nx) | 0; if (sxx < 0) sxx = 0; else if (sxx >= W) sxx = W-1;
    let syy = (sy + ny) | 0; if (syy < 0) syy = 0; else if (syy >= H) syy = H-1;
    let v = INK[syy*W + sxx] * (1 + BR * bri) * DOT_ENV[k];
    if (v < 0) v = 0; else if (v > 1) v = 1;
    DOT_V[k] = v;
    sumV += v;
  }

  // Pass 2: global brightness normalization (preserves total ink budget so the
  // animation doesn't pulse with the noise). Equivalent to the original 3-pass
  // converging clamp, but on ~500 samples instead of 36864.
  if (sumV > 0 && dotInkTotal > 0) {
    const k1 = dotInkTotal / sumV;
    let sum2 = 0;
    for (let k = 0; k < NDOTS; k++) {
      let v = DOT_V[k] * k1; if (v > 1) v = 1;
      DOT_V[k] = v; sum2 += v;
    }
    if (sum2 > 0) {
      const k2 = dotInkTotal / sum2;
      for (let k = 0; k < NDOTS; k++) {
        let v = DOT_V[k] * k2; if (v > 1) v = 1;
        DOT_V[k] = v;
      }
    }
  }

  // Pass 3: build one combined path of all dot circles; single fill at end.
  ctx.clearRect(0, 0, DISPLAY_PX, DISPLAY_PX);
  ctx.fillStyle = 'rgb(20,24,32)';
  ctx.beginPath();
  const ctEqOne = INV_CT === 1;
  for (let k = 0; k < NDOTS; k++) {
    let v = DOT_V[k];
    if (v < 0.04) continue;
    if (!ctEqOne) v = Math.pow(v, INV_CT);

    let drawX = DOT_DX[k], drawY = DOT_DY[k], rMul = 1;
    if (useCursor) {
      const ddx = drawX - cmx, ddy = drawY - cmy;
      const d2 = ddx*ddx + ddy*ddy;
      if (d2 < CUTOFF2) {
        const infl = Math.exp(-d2 / SIGMA2) * infActive;
        const d = Math.sqrt(d2) + 1e-3;
        const pushAmt = M_R * M_PUSH * infl;
        drawX += (ddx / d) * pushAmt; drawY += (ddy / d) * pushAmt;
        rMul = 1 + M_SWELL * infl;
      }
    }
    const r = MAX_R * v * rMul;
    ctx.moveTo(drawX + r, drawY);
    ctx.arc(drawX, drawY, r, 0, TWO_PI);
  }
  ctx.fill();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
